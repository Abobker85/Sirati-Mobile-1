workflows:
  android-preview:
    name: Android App Preview
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable
      vars:
        SIRATI_API_BASE_URL: "https://siratie.com/api"

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
          flutter gen-l10n

      - name: Analyze
        script: flutter analyze

      # Goldens are OS/engine-sensitive (Windows baselines vs macOS CI).
      # Tagged `golden` — excluded here; run locally / on matching OS instead.
      - name: Run tests
        script: flutter test --exclude-tags golden

      - name: Build Android debug APK for App Preview
        script: |
          flutter build apk --debug \
            --dart-define=SIRATI_API_BASE_URL=$SIRATI_API_BASE_URL \
            --dart-define=SENTRY_DSN=$SENTRY_DSN \
            --dart-define=SENTRY_ENVIRONMENT=preview

    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk

  ios-preview:
    name: iOS Simulator App Preview
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      vars:
        SIRATI_API_BASE_URL: "https://siratie.com/api"

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
          flutter gen-l10n

      - name: Analyze
        script: flutter analyze

      - name: Run tests
        script: flutter test --exclude-tags golden

      - name: Build iOS simulator app for App Preview
        script: |
          flutter build ios --simulator --debug \
            --dart-define=SIRATI_API_BASE_URL=$SIRATI_API_BASE_URL \
            --dart-define=SENTRY_DSN=$SENTRY_DSN \
            --dart-define=SENTRY_ENVIRONMENT=preview

    artifacts:
      - build/ios/iphonesimulator/Runner.app

  # Run by hand whenever pubspec plugins change: resolves the iOS pods on
  # macOS and publishes ios/Podfile.lock to commit. Builds nothing.
  ios-pod-lock:
    name: iOS Podfile.lock
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: 26
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
          flutter gen-l10n
      - name: Analyze
        script: flutter analyze
      - name: Run tests
        script: flutter test --exclude-tags golden
      - name: Resolve pods
        script: |
          cd ios
          pod install --repo-update
    artifacts:
      - ios/Podfile.lock

  ios-testflight:
    name: iOS TestFlight Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic Sirati CI
    environment:
      flutter: stable
      # App Store uploads require the iOS 26 SDK (Xcode 26).
      xcode: 26
      cocoapods: default
      # CERTIFICATE_PRIVATE_KEY (secure variable in this group) lets the signing
      # step create the Apple Distribution certificate and App Store profile itself.
      groups:
        - sirati_ios
      vars:
        SIRATI_API_BASE_URL: "https://siratie.com/api"
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
          flutter gen-l10n
      - name: Check release configuration
        script: |
          # A release must sell through the App Store: without the public
          # RevenueCat iOS key the paywall would silently stay informational.
          case "$REVENUECAT_IOS_KEY" in
            appl_*) ;;
            *) echo "REVENUECAT_IOS_KEY (appl_...) is missing from the sirati_ios group."; exit 1 ;;
          esac
      - name: Install CocoaPods
        script: |
          cd ios
          # Release gate: pods come only from the committed lock. Run the
          # "iOS Podfile.lock" workflow once and commit its artifact first.
          if [ ! -f Podfile.lock ]; then
            echo "ios/Podfile.lock is not committed; run the ios-pod-lock workflow and commit its artifact."
            exit 1
          fi
          pod install --deployment
          cd ..
      - name: Analyze
        script: flutter analyze
      - name: Run tests
        script: flutter test --exclude-tags golden
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.sirati.sirati" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
          echo "CERTIFICATE_PRIVATE_KEY set: $([ -n "$CERTIFICATE_PRIVATE_KEY" ] && echo yes || echo NO)"
          security find-identity -v -p codesigning
          ls ~/Library/MobileDevice/Provisioning\ Profiles
      - name: Validate privacy manifest
        script: plutil -lint ios/Runner/PrivacyInfo.xcprivacy
      - name: Build iOS IPA
        script: |
          # App Store Connect already has builds up to 23 from earlier uploads, ahead
          # of Codemagic's own counter, so offset it to stay above them.
          BUILD_NUM=$(( ${BUILD_NUMBER:-0} + 100 ))
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist \
            --build-number=$BUILD_NUM \
            --dart-define=SIRATI_API_BASE_URL=$SIRATI_API_BASE_URL \
            --dart-define=REVENUECAT_IOS_KEY=$REVENUECAT_IOS_KEY
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
